databases:
  - name: checkoutflow-db
    databaseName: checkoutflow
    user: checkoutflow_user
    plan: free

services:
  - type: web
    name: checkoutflow-app
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: checkoutflow-db
          property: connectionString
      - key: SHOPIFY_CLIENT_ID
        value: "8e0324d85885c5f335ca3a37e1c0e796"
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_REDIRECT_URI
        value: "https://checkoutflow-app.onrender.com/api/auth/callback"
